<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd84d">
<meta name="apple-mobile-web-app-title" content="Aljoša uči">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Aljoša uči</title>
<style>
  :root {
    --bg1: #fff6d6;
    --bg2: #d8f1ff;
    --ink: #2b2d42;
    --card: #ffffff;
    --tile: #ffffff;
    --tile-ink: #3a3f7a;
    --tile-border: #c9d4ff;
    --ok: #3cc46b;
    --bad: #ff5a5f;
    --hl: #ff7a00;
    --shadow: 0 6px 0 rgba(0,0,0,.12), 0 10px 24px rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: "Segoe UI", "Trebuchet MS", system-ui, -apple-system, Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .hidden { display: none !important; }

  /* ---------- MENI ---------- */
  #menu { align-items: center; justify-content: center; gap: 2.5vmin; overflow-y: auto; }
  #menu h1 { margin: 0 0 1vmin; font-size: clamp(36px, 9vmin, 84px); letter-spacing: 1px;
    color: #ff7a00; text-shadow: 0 4px 0 #ffd0a0; text-align: center; }
  #menu h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .modes { display: grid; gap: 2vmin; width: min(560px, 100%); grid-template-columns: 1fr; }
  .mode { display: flex; align-items: center; gap: 16px; text-align: left;
    padding: 2.2vmin 22px; border-radius: 26px; background: var(--card); box-shadow: var(--shadow);
    font-size: clamp(18px, 3vmin, 26px); font-weight: 700; transition: transform .12s; }
  .mode:active { transform: translateY(4px) scale(.98); }
  .mode .badge { flex: 0 0 auto; min-width: 2.9em; padding: .35em .5em; border-radius: 18px; color: #fff;
    font-size: 1.25em; font-weight: 800; text-align: center; letter-spacing: 2px; }
  .mode:nth-child(1) .badge { background: #ff7a00; }
  .mode:nth-child(2) .badge { background: #3a86ff; }
  .mode:nth-child(3) .badge { background: #00b4d8; }
  .mode:nth-child(4) .badge { background: #8338ec; }
  .mode:nth-child(5) .badge { background: #e5489b; }

  /* ---------- IGRA ---------- */
  #game { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 0 0 auto; }
  .round-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow);
    font-size: 28px; display: grid; place-items: center; }
  .round-btn:active { transform: translateY(3px); }
  #progress { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; font-size: clamp(18px, 3.4vmin, 30px); }
  #progress span { filter: grayscale(1) opacity(.35); transition: filter .3s, transform .3s; }
  #progress span.on { filter: none; transform: scale(1.15); }

  #top { flex: 0 0 40%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  #hint { font-size: clamp(15px, 2.6vmin, 22px); opacity: .7; margin-bottom: 1vmin; font-weight: 600; text-align: center; }
  #slot { position: relative; width: var(--cs, 200px); height: var(--cs, 200px); }
  #card { position: absolute; inset: 0; border-radius: 28px; background: var(--card); box-shadow: var(--shadow);
    display: grid; place-items: center; touch-action: none; cursor: grab; z-index: 10;
    transition: transform .35s cubic-bezier(.3,1.4,.5,1), opacity .35s; will-change: transform; }
  #card.dragging { transition: none; cursor: grabbing; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
  #card.fly { transition: transform .45s ease-in, opacity .45s ease-in; }
  #card.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
  #card .pic { line-height: 1; pointer-events: none; }
  #card .many { display: grid; gap: 2px; place-items: center; pointer-events: none; }
  #word { height: 1.3em; margin-top: 1vmin; font-size: clamp(28px, 6vmin, 56px); font-weight: 800; letter-spacing: 2px; }
  #word .hl { color: var(--hl); }
  #word.show { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }

  #board { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #tiles { display: grid; gap: var(--gap, 8px); }
  .tile { border-radius: 18%; background: var(--tile); color: var(--tile-ink);
    border: 3px solid var(--tile-border); box-shadow: 0 4px 0 var(--tile-border);
    display: grid; place-items: center; font-weight: 800; line-height: 1;
    transition: background .2s, transform .15s, border-color .2s; }
  .tile.over { background: #fff3c4; border-color: #ffb703; transform: scale(1.1); }
  .tile.ok { background: var(--ok); border-color: #26a352; color: #fff; box-shadow: 0 4px 0 #26a352; }
  .tile.bad { background: var(--bad); border-color: #d63a3f; color: #fff; animation: shake .45s; }
  .tile.hint { animation: pulse 1s ease-in-out infinite; border-color: #ffb703; }

  /* ---------- KRAJ ---------- */
  #end { align-items: center; justify-content: center; gap: 3vmin; text-align: center; }
  #end .trophy { font-size: clamp(90px, 26vmin, 220px); animation: bob 2s ease-in-out infinite; }
  #end h2 { margin: 0; font-size: clamp(34px, 8vmin, 72px); color: #ff7a00; text-shadow: 0 4px 0 #ffd0a0; }
  #end .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .big-btn { padding: 18px 34px; border-radius: 24px; background: var(--card); box-shadow: var(--shadow);
    font-size: clamp(20px, 3.6vmin, 30px); font-weight: 800; }
  .big-btn.primary { background: #3cc46b; color: #fff; }
  .big-btn:active { transform: translateY(4px); }

  .confetti { position: fixed; pointer-events: none; z-index: 50; font-size: 34px;
    animation: burst 1.1s ease-out forwards; }

  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  @keyframes pop { 0% { transform: scale(.4) } 100% { transform: scale(1) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-9px) } 40%,80% { transform: translateX(9px) } }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12); background: #fff3c4; } }
  @keyframes burst {
    0% { transform: translate(0,0) scale(.5) rotate(0); opacity: 1 }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0 }
  }
</style>
</head>
<body>

<div id="menu" class="screen">
  <h1><span>Aljoša uči</span> 🦉</h1>
  <div class="modes">
    <button class="mode" data-mode="num"><span class="badge">123</span>Brojevi</button>
    <button class="mode" data-mode="latU"><span class="badge">ABC</span>Velika latinična slova</button>
    <button class="mode" data-mode="latL"><span class="badge">abc</span>Mala latinična slova</button>
    <button class="mode" data-mode="cyrU"><span class="badge">АБВ</span>Velika ćirilična slova</button>
    <button class="mode" data-mode="cyrL"><span class="badge">абв</span>Mala ćirilična slova</button>
  </div>
</div>

<div id="game" class="screen hidden">
  <header>
    <button class="round-btn" id="homeBtn" aria-label="Meni">🏠</button>
    <div id="progress"></div>
    <button class="round-btn" id="soundBtn" aria-label="Zvuk">🔊</button>
  </header>
  <section id="top">
    <div id="hint">Prevuci sličicu na pravo slovo</div>
    <div id="slot"><div id="card"></div></div>
    <div id="word"></div>
  </section>
  <section id="board"><div id="tiles"></div></section>
</div>

<div id="end" class="screen hidden">
  <div class="trophy">🏆</div>
  <h2>Bravo, Aljoša!</h2>
  <div class="row">
    <button class="big-btn primary" id="againBtn">Igraj ponovo</button>
    <button class="big-btn" id="menuBtn">Meni</button>
  </div>
</div>

<script>
// Sličice koje ne postoje kao emoji (crtež)
const SVG_NAIL = `<svg viewBox="0 0 100 100" width="1em" height="1em"><g transform="rotate(35 50 50)">
  <rect x="24" y="6" width="52" height="12" rx="5" fill="#8a8f98" stroke="#5f656e" stroke-width="2"/>
  <path d="M44 18 H56 V78 L50 96 L44 78 Z" fill="#c3c9d1" stroke="#6c727b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="47" y="20" width="3" height="56" fill="#fff" opacity=".6"/></g></svg>`;
const SVG_SWING = `<svg viewBox="0 0 100 100" width="1em" height="1em">
  <path d="M8 96 L26 8 M92 96 L74 8" stroke="#8d5524" stroke-width="7" stroke-linecap="round"/>
  <path d="M20 10 H80" stroke="#a0662c" stroke-width="8" stroke-linecap="round"/>
  <path d="M38 13 V70 M62 13 V70" stroke="#555" stroke-width="3"/>
  <rect x="28" y="68" width="44" height="9" rx="4" fill="#e63946"/>
  <path d="M8 96 H92" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/></svg>`;

const SVG_BREAD = `<svg viewBox="0 0 100 100" width="1em" height="1em">
  <ellipse cx="50" cy="80" rx="42" ry="6" fill="#000" opacity=".12"/>
  <path d="M8 66 C8 34 28 24 50 24 C72 24 92 34 92 66 C92 76 84 80 50 80 C16 80 8 76 8 66 Z" fill="#c8813a" stroke="#8a5320" stroke-width="3"/>
  <path d="M14 62 C16 40 32 30 50 30 C68 30 84 40 86 62" fill="none" stroke="#e3a65c" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M28 40 L36 56 M44 34 L52 52 M60 34 L68 52 M74 40 L80 54" stroke="#f3d29b" stroke-width="5" stroke-linecap="round"/>
</svg>`;

// [latinično slovo, ćirilično slovo, riječ latinicom, riječ ćirilicom, sličica]
const LETTERS = [
  ['A','А','avion','авион','✈️'],
  ['B','Б','banana','банана','🍌'],
  ['C','Ц','cvijet','цвијет','🌸'],
  ['Č','Ч','čokolada','чоколада','🍫'],
  ['Ć','Ћ','ćurka','ћурка','🦃'],
  ['D','Д','drvo','дрво','🌳'],
  ['Dž','Џ','džip','џип','🚙'],
  ['Đ','Ђ','đak','ђак','🧑‍🎓'],
  ['E','Е','ekser','ексер', SVG_NAIL],
  ['F','Ф','foka','фока','🦭'],
  ['G','Г','grožđe','грожђе','🍇'],
  ['H','Х','hljeb','хљеб', SVG_BREAD],
  ['I','И','irvas','ирвас','🦌'],
  ['J','Ј','jabuka','јабука','🍎'],
  ['K','К','kuća','кућа','🏠'],
  ['L','Л','lav','лав','🦁'],
  ['Lj','Љ','ljuljaška','љуљашка', SVG_SWING],
  ['M','М','mačka','мачка','🐱'],
  ['N','Н','nos','нос','👃'],
  ['Nj','Њ','njuška','њушка','🐽'],
  ['O','О','ovca','овца','🐑'],
  ['P','П','pas','пас','🐶'],
  ['R','Р','riba','риба','🐟'],
  ['S','С','sunce','сунце','☀️'],
  ['Š','Ш','šešir','шешир','🎩'],
  ['T','Т','tigar','тигар','🐯'],
  ['U','У','uvo','уво','👂'],
  ['V','В','voz','воз','🚂'],
  ['Z','З','zec','зец','🐰'],
  ['Ž','Ж','žaba','жаба','🐸'],
];
const CYR_ORDER = 'А Б В Г Д Ђ Е Ж З И Ј К Л Љ М Н Њ О П Р С Т Ћ У Ф Х Ц Ч Џ Ш'.split(' ');
const NUM_WORDS = ['nula','jedan','dva','tri','četiri','pet','šest','sedam','osam','devet','deset'];
const NUM_PICS = ['🍎','🐤','⭐','🎈','🐟','🍓','🚗','🌼','🐞','🍪','🦋','⚽'];
const ROUND_SIZE = 10;

const $ = s => document.querySelector(s);
const screens = { menu: $('#menu'), game: $('#game'), end: $('#end') };
const card = $('#card'), slot = $('#slot'), tilesEl = $('#tiles'), wordEl = $('#word'), progressEl = $('#progress');

let mode = null, items = [], idx = 0, tiles = [], mistakes = 0, busy = false;
let soundOn = true;

function show(name) {
  for (const k in screens) screens[k].classList.toggle('hidden', k !== name);
  if (name === 'game') requestAnimationFrame(layout);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- Priprema runde ----------
function buildRound(m) {
  mode = m;
  if (m === 'num') {
    tiles = Array.from({ length: 10 }, (_, i) => String(i + 1));
    items = shuffle(Array.from({ length: 10 }, (_, i) => {
      const n = i + 1;
      return { key: String(n), count: n, pic: NUM_PICS[Math.random() * NUM_PICS.length | 0],
               word: NUM_WORDS[n], speak: NUM_WORDS[n], hlLen: 0 };
    }));
  } else {
    const cyr = m.startsWith('cyr'), lower = m.endsWith('L');
    const fix = s => lower ? s.toLowerCase() : s;
    tiles = (cyr ? CYR_ORDER : LETTERS.map(l => l[0])).map(fix);
    items = shuffle(LETTERS.map(([lat, c, wLat, wCyr, pic]) => {
      const letter = cyr ? c : lat;
      const w = cyr ? wCyr : wLat;
      return { key: fix(letter), pic, count: 1, speak: wLat,
               word: lower ? w.toLowerCase() : w.toUpperCase(), hlLen: letter.length };
    })).slice(0, ROUND_SIZE);
  }
  idx = 0;
  tilesEl.innerHTML = '';
  for (const t of tiles) {
    const el = document.createElement('div');
    el.className = 'tile'; el.textContent = t; el.dataset.key = t;
    tilesEl.appendChild(el);
  }
  progressEl.innerHTML = items.map(() => '<span>⭐</span>').join('');
  show('game');
  showItem();
}

function showItem() {
  const it = items[idx];
  mistakes = 0; busy = false;
  wordEl.textContent = ''; wordEl.classList.remove('show');
  for (const el of tilesEl.children) el.classList.remove('ok', 'bad', 'hint', 'over');
  card.className = ''; card.style.transform = ''; card.style.opacity = '';
  if (it.count === 1) card.innerHTML = `<span class="pic">${it.pic}</span>`;
  else card.innerHTML = `<div class="many">${Array(it.count).fill(`<span class="pic">${it.pic}</span>`).join('')}</div>`;
  sizeCard();
  void card.offsetWidth; card.classList.add('pop');
}

// ---------- Raspored (prilagođava se ekranu) ----------
function layout() { sizeCard(); layoutTiles(); }

function sizeCard() {
  const top = $('#top').getBoundingClientRect();
  const cs = Math.max(90, Math.min(top.height * 0.62, top.width * 0.6, 360));
  slot.style.setProperty('--cs', cs + 'px');
  const it = items[idx]; if (!it) return;
  if (it.count === 1) {
    card.querySelector('.pic').style.fontSize = (cs * 0.62) + 'px';
  } else {
    const n = it.count;
    const cols = { 2: 2, 3: 3, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 3, 10: 5 }[n];
    const rows = Math.ceil(n / cols);
    const many = card.querySelector('.many');
    many.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    const f = Math.min(cs * 0.82 / cols, cs * 0.82 / rows) * 0.82;
    many.querySelectorAll('.pic').forEach(p => p.style.fontSize = f + 'px');
  }
}

function layoutTiles() {
  const r = $('#board').getBoundingClientRect();
  const n = tiles.length; if (!n || !r.width) return;
  const gap = Math.max(6, Math.min(12, Math.min(r.width, r.height) * 0.015));
  let best = { size: 0, cols: 1 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const size = Math.min((r.width - gap * (cols - 1)) / cols, (r.height - gap * (rows - 1)) / rows);
    if (size > best.size) best = { size, cols };
  }
  const size = Math.floor(Math.min(best.size, 150));
  tilesEl.style.setProperty('--gap', gap + 'px');
  tilesEl.style.gridTemplateColumns = `repeat(${best.cols}, ${size}px)`;
  for (const el of tilesEl.children) {
    el.style.width = el.style.height = size + 'px';
    el.style.fontSize = (size * (el.dataset.key.length > 1 ? 0.44 : 0.58)) + 'px';
  }
}
window.addEventListener('resize', () => { if (!screens.game.classList.contains('hidden')) layout(); });

// ---------- Prevlačenje (miš i dodir) ----------
let drag = null;
card.addEventListener('pointerdown', e => {
  if (busy) return;
  ensureAudio();
  card.setPointerCapture(e.pointerId);
  card.classList.remove('pop');
  card.classList.add('dragging');
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, over: null };
  card.style.transform = 'scale(1.08)';
});
card.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (Math.hypot(dx, dy) > 8) drag.moved = true;
  card.style.transform = `translate(${dx}px, ${dy}px) scale(${drag.moved ? 0.6 : 1.08})`;
  const t = tileAt(e.clientX, e.clientY);
  if (t !== drag.over) {
    drag.over && drag.over.classList.remove('over');
    t && t.classList.add('over');
    drag.over = t;
  }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  card.classList.remove('dragging');
  d.over && d.over.classList.remove('over');
  if (!d.moved) { card.style.transform = ''; say(items[idx].speak); return; } // dodir = izgovori reč
  const t = e.type === 'pointerup' ? tileAt(e.clientX, e.clientY) : null;
  if (!t) { card.style.transform = ''; return; }
  if (t.dataset.key === items[idx].key) correct(t, e.clientX - d.x0, e.clientY - d.y0);
  else wrong(t);
}
card.addEventListener('pointerup', endDrag);
card.addEventListener('pointercancel', endDrag);

function tileAt(x, y) {
  for (const el of tilesEl.children) {
    const r = el.getBoundingClientRect();
    const pad = r.width * 0.12;
    if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return el;
  }
  return null;
}

function correct(tile, curDx, curDy) {
  busy = true;
  const it = items[idx];
  tile.classList.add('ok');
  const tr = tile.getBoundingClientRect(), sr = slot.getBoundingClientRect();
  const dx = tr.left + tr.width / 2 - (sr.left + sr.width / 2);
  const dy = tr.top + tr.height / 2 - (sr.top + sr.height / 2);
  card.classList.add('fly');
  card.style.transform = `translate(${dx}px, ${dy}px) scale(.2)`;
  card.style.opacity = '0';
  confetti(tr.left + tr.width / 2, tr.top + tr.height / 2);
  playOk();
  progressEl.children[idx].classList.add('on');
  // prikaži reč, prvo slovo istaknuto
  const w = it.word;
  wordEl.innerHTML = it.hlLen
    ? `<span class="hl">${w.slice(0, it.hlLen)}</span>${w.slice(it.hlLen)}`
    : `<span class="hl">${it.key}</span> – ${w}`;
  wordEl.classList.add('show');
  say(it.speak);
  setTimeout(() => {
    idx++;
    if (idx >= items.length) { playWin(); show('end'); }
    else showItem();
  }, 2000);
}

function wrong(tile) {
  mistakes++;
  playBad();
  tile.classList.remove('bad'); void tile.offsetWidth; tile.classList.add('bad');
  setTimeout(() => tile.classList.remove('bad'), 600);
  card.style.transform = '';
  if (mistakes >= 2) {
    const right = [...tilesEl.children].find(el => el.dataset.key === items[idx].key);
    right && right.classList.add('hint');
  }
}

function confetti(x, y) {
  const bits = ['⭐', '🎉', '✨', '🌟', '🎈'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = bits[i % bits.length];
    const a = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 140;
    s.style.left = (x - 17) + 'px'; s.style.top = (y - 17) + 'px';
    s.style.setProperty('--dx', Math.cos(a) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(a) * dist - 60 + 'px');
    s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

// ---------- Zvuk ----------
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, start, dur, type = 'sine', vol = 0.18) {
  if (!soundOn || !actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  const t = actx.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function playOk() { [523, 659, 784].forEach((f, i) => tone(f, i * 0.09, 0.25, 'triangle')); }
function playBad() { tone(220, 0, 0.18, 'square', 0.08); tone(175, 0.15, 0.25, 'square', 0.08); }
function playWin() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, 'triangle')); }

// Izgovor reči: koristi srpski, hrvatski ili bosanski glas ako postoji na uređaju
let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^sr/i.test(v.lang)) || vs.find(v => /^hr/i.test(v.lang)) || vs.find(v => /^bs/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!soundOn || !voice) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = voice; u.lang = voice.lang; u.rate = 0.85; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { ensureAudio(); buildRound(b.dataset.mode); }));
$('#homeBtn').addEventListener('click', () => { busy = true; show('menu'); });
$('#menuBtn').addEventListener('click', () => show('menu'));
$('#againBtn').addEventListener('click', () => buildRound(mode));
$('#soundBtn').addEventListener('click', e => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
});
document.addEventListener('contextmenu', e => e.preventDefault());
